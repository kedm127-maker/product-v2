<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股相對估值</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#EDF0F4;--surface:#FFFFFF;--ink:#1A1D23;--muted:#6B7280;
  --rule:#D6DCE4;--rule-soft:#E8ECF1;--up:#C0392B;--down:#17795E;
  --flag-bg:#FBF1E3;--pick-bg:#E7F2EE;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,"Noto Sans TC",sans-serif;font-size:15px;line-height:1.5}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:16px;margin-bottom:20px}
h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.meta{color:var(--muted);font-size:13px;margin-left:auto;text-align:right}
.meta b{font-weight:500;color:var(--ink)}
.mode{display:flex;margin-bottom:14px;border-bottom:1px solid var(--rule)}
.mode button{font:inherit;font-size:14px;padding:7px 16px;border:none;background:none;
  color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.warn{color:#B45309}
.mode button[aria-pressed="true"]{color:var(--ink);font-weight:500;border-bottom-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips button{font:inherit;font-size:13px;padding:5px 11px;border:1px solid var(--rule);
  background:var(--surface);color:var(--ink);border-radius:3px;cursor:pointer}
.chips button:hover{border-color:#A9B4C2}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tierrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:16px}
.tierrow .lbl{font-size:13px;color:var(--muted);margin-right:4px}
.tierrow button{font:inherit;font-size:12px;padding:4px 10px;border:1px solid var(--rule);
  background:var(--surface);color:var(--ink);border-radius:3px;cursor:pointer}
.tierrow button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.summary{display:flex;flex-wrap:wrap;align-items:baseline;gap:18px;padding:14px 16px;
  background:var(--surface);border:1px solid var(--rule);border-bottom:none}
.summary h2{font-size:16px;font-weight:600;margin:0}
.summary .kv{font-size:13px;color:var(--muted)}
.summary .kv span{color:var(--ink)}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--rule);font-size:14px}
thead th{text-align:right;font-weight:500;font-size:12px;color:var(--muted);padding:9px;
  border-bottom:1px solid var(--rule);white-space:nowrap;background:#F6F8FA;cursor:pointer;user-select:none}
thead th:first-child,thead th:nth-child(2){text-align:left}
thead th[aria-sort]{color:var(--ink)}
tbody td{padding:9px;border-bottom:1px solid var(--rule-soft);text-align:right;white-space:nowrap}
tbody td:first-child,tbody td:nth-child(2){text-align:left}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#F6F8FA}
tbody tr.pick{background:var(--pick-bg)}
tbody tr.trap{background:var(--flag-bg)}
.name{font-weight:500}
.code{color:var(--muted);font-size:12px}
.pos{color:var(--up)}.neg{color:var(--down)}
.stale{color:var(--muted)}
.mark{font-size:11px;padding:2px 6px;border-radius:2px;white-space:nowrap}
.mark.pick{background:#C9E2D8;color:#0E4F3C}
.mark.trap{background:#F0DBBB;color:#7A4206}
.tierbadge,.onlybadge{font-size:11px;color:var(--muted);border:1px solid var(--rule);
  border-radius:2px;padding:1px 5px;margin-left:6px}
.devbar{position:relative;height:16px;width:150px;margin-left:auto}
.devbar .axis{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--rule)}
.devbar .fill{position:absolute;top:3px;height:10px}
.devbar .fill.cheap{background:var(--down);right:50%}
.devbar .fill.rich{background:var(--up);left:50%}
.note{margin-top:18px;font-size:13px;color:var(--muted);max-width:74ch;line-height:1.65}
.status{padding:24px 20px;background:var(--surface);border:1px solid var(--rule);color:var(--muted);line-height:1.7}
.status b{color:var(--ink);font-weight:500}
.status code{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink)}
@media (max-width:820px){.hide-sm{display:none}.devbar{width:92px}.wrap{padding:20px 12px 60px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>台股相對估值</h1>
  <div class="meta" id="meta"></div>
</header>
<nav class="mode" id="mode" aria-label="分組方式">
  <button data-m="theme" aria-pressed="true">題材</button>
  <button data-m="industry" aria-pressed="false">官方產業</button>
</nav>
<nav class="chips" id="chips" aria-label="分組"></nav>
<div class="tierrow" id="tierrow" hidden></div>
<div id="panel"><div class="status">讀取中…</div></div>
<p class="note" id="note"></p>
</div>

<script>
var SHEET = "1-6j_9R8EtIS780FRKBv4MPAq63ySaBghRSPW2rDA48U";
var GID = { themes: "0", company_theme: "1234232077", companies: "1330551595" };
var EP = {
  val: "https://openapi.twse.com.tw/v1/exchangeReport/BWIBBU_ALL",
  day: "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL",
  rev: "https://openapi.twse.com.tw/v1/opendata/t187ap05_L"
};
var FALLBACK = "./data/latest.json";
var CHEAP_CUT = -0.15;
var MIN_PEERS = 3;

function num(v){
  if(v===null||v===undefined||v==="") return null;
  var n=parseFloat(String(v).replace(/[,%\s]/g,""));
  return (isFinite(n)&&n!==0)?n:null;
}
// 百分比一律不猜單位。猜的代價：48 家公司的營收年增曾被放大一百倍
// （維熹 -1.26% 顯示成 -126%），因為舊版用「絕對值 >1.5 才除以 100」判斷。
function pctAPI(v){var n=num(v);return n===null?null:n/100;}          // 端點給的是百分比數值
function pctCell(v){                                                   // Sheet 欄位：看有沒有 % 號
  var s=String(v===null||v===undefined?"":v);
  var n=num(s);if(n===null)return null;
  return s.indexOf("%")>=0?n/100:n;   // 沒有 % 就視為已是小數；格式不一致會明顯爆掉而非靜默錯
}
function pct(n,d){if(n===null)return "—";d=(d===undefined?1:d);return (n>=0?"+":"")+(n*100).toFixed(d)+"%";}
function fix(n,d){if(n===null)return "—";return n.toFixed(d===undefined?2:d);}
function median(a){
  var s=a.filter(function(x){return x!==null&&isFinite(x);}).sort(function(x,y){return x-y;});
  if(!s.length)return null;var m=s.length>>1;
  return s.length%2?s[m]:(s[m-1]+s[m])/2;
}
function roc(ym){var s=String(ym||"");return s.length>=5?(parseInt(s.slice(0,3),10)+1911)+"/"+s.slice(3):s;}
function tid(v){return String(v===null||v===undefined?"":v).trim();}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}

function parseCSV(text){
  var rows=[],row=[],cell="",q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    } else {
      if(c==='"') q=true;
      else if(c===","){row.push(cell);cell="";}
      else if(c==="\n"){row.push(cell);rows.push(row);row=[];cell="";}
      else if(c!=="\r") cell+=c;
    }
  }
  if(cell!==""||row.length){row.push(cell);rows.push(row);}
  return rows;
}

async function sheet(gid){
  var url="https://docs.google.com/spreadsheets/d/"+SHEET+"/gviz/tq?tqx=out:csv&gid="+gid;
  var txt=await (await fetch(url,{cache:"no-store"})).text();
  var rows=parseCSV(txt);
  if(!rows.length) return {cols:[],data:[]};
  var cols=rows[0].map(function(s){return String(s).trim();});
  var data=[];
  for(var i=1;i<rows.length;i++){
    var o={},empty=true;
    for(var j=0;j<cols.length;j++){
      var v=rows[i][j]===undefined?"":String(rows[i][j]).trim();
      o[cols[j]]=v===""?null:v;
      if(v!=="")empty=false;
    }
    if(!empty)data.push(o);
  }
  return {cols:cols,data:data};
}

async function grab(u){
  var r=await fetch(u,{cache:"no-store"});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

var STOCKS={},GROUPS={theme:{},industry:{}},THEMEMETA={},DIAG={},asOf={};
var mode="theme",current=null,tier=null,sortKey="dev",sortDir=1;

async function load(){
  // 本地快照優先：它同源、不受 CORS 擋，而且含上櫃；直接打端點只拿得到上市。
  var val=null,day=null,rev=null,rows=null;
  try{
    var s=await grab(FALLBACK);
    asOf.src="本地快照";
    if(s.rows){rows=s.rows;asOf.iso=s.as_of;asOf.ym=s.ym;
               asOf.markets=s.markets||{};asOf.missing=s.missing||[];}
    else{val=s.val;day=s.day;rev=s.rev;asOf.missing=["tpex"];}
  }catch(e){
    try{
      var a=await Promise.all([grab(EP.val),grab(EP.day),grab(EP.rev)]);
      val=a[0];day=a[1];rev=a[2];asOf.src="證交所 OpenAPI";asOf.missing=["tpex"];
    }catch(e2){
      document.getElementById("panel").innerHTML=
        '<div class="status"><b>讀不到證交所資料。</b>直接呼叫被瀏覽器擋下，'+
        "<code>data/latest.json</code> 也不存在。先讓排程跑過一次。</div>";
      return;
    }
  }

  var themes=[],links=[],comps=[];
  try{
    var g=await Promise.all([sheet(GID.themes),sheet(GID.company_theme),sheet(GID.companies)]);
    themes=g[0].data;links=g[1].data;comps=g[2].data;
    DIAG={themes:g[0],links:g[1],comps:g[2]};
    asOf.sheet=true;
  }catch(e){
    asOf.sheet=false;DIAG.err=String(e);
  }

  if(rows){
    for(var j=0;j<rows.length;j++){
      var q=rows[j],qc=tid(q.c);
      if(!qc)continue;
      STOCKS[qc]={code:qc,name:q.n,industry:q.i,market:q.m,
        yoy:pctAPI(q.yoy),cum:pctAPI(q.cum),
        pe:num(q.pe),pb:num(q.pb),dy:pctAPI(q.dy),close:num(q.close),
        opm:null,gpm:null,quarter:null,mainBiz:""};
    }
    rev=[];val=[];day=[];
  }
  for(var i=0;i<rev.length;i++){
    var r=rev[i],c=tid(r["公司代號"]);
    if(!c)continue;
    STOCKS[c]={code:c,name:r["公司名稱"],industry:r["產業別"],
      market:"twse",
      yoy:pctAPI(r["營業收入-去年同月增減(%)"]),cum:pctAPI(r["累計營業收入-前期比較增減(%)"]),
      pe:null,pb:null,dy:null,close:null,opm:null,gpm:null,quarter:null,mainBiz:""};
    asOf.ym=r["資料年月"];
  }
  for(i=0;i<val.length;i++){
    var t=STOCKS[tid(val[i].Code)];if(!t)continue;
    t.pe=num(val[i].PEratio);t.pb=num(val[i].PBratio);t.dy=pctAPI(val[i].DividendYield);
  }
  for(i=0;i<day.length;i++){
    var t2=STOCKS[tid(day[i].Code)];if(!t2)continue;
    t2.close=num(day[i].ClosingPrice);asOf.day=day[i].Date||asOf.day;
  }
  for(i=0;i<comps.length;i++){
    var cc=comps[i],t3=STOCKS[tid(cc.ticker)];if(!t3)continue;
    t3.opm=pctCell(cc.op_margin);t3.gpm=pctCell(cc.gross_margin);
    t3.quarter=tid(cc.quarter);t3.mainBiz=cc.main_business;
  }

  for(var k in STOCKS){
    var s2=STOCKS[k];
    if(s2.industry&&(s2.pe!==null||s2.pb!==null)){
      if(!GROUPS.industry[s2.industry])GROUPS.industry[s2.industry]=[];
      GROUPS.industry[s2.industry].push(s2);
    }
  }
  for(i=0;i<themes.length;i++){
    var id=tid(themes[i].theme_id);if(!id)continue;
    THEMEMETA[id]={name:themes[i]["正名"]||id,parent:themes[i]["上層題材"]||""};
  }
  var matched=0;
  for(i=0;i<links.length;i++){
    var L=links[i],st=STOCKS[tid(L.ticker)],lid=tid(L.theme_id);
    if(!st||!THEMEMETA[lid])continue;
    if(st.pe===null&&st.pb===null)continue;
    matched++;
    var row={};for(var p in st)row[p]=st[p];
    row.tier=tid(L.current_max_tier);
    if(!GROUPS.theme[lid])GROUPS.theme[lid]=[];
    GROUPS.theme[lid].push(row);
  }
  DIAG.matched=matched;

  var MKT={twse:"上市",tpex:"上櫃"};
  var dstr=asOf.iso?asOf.iso.replace(/-/g,"/")
          :(asOf.day?roc(asOf.day.slice(0,7))+"/"+asOf.day.slice(7):"—");
  var cov=[];for(var mk in (asOf.markets||{}))cov.push(MKT[mk]||mk);
  var miss=(asOf.missing||[]).map(function(x){return MKT[x]||x;});
  document.getElementById("meta").innerHTML=
    "收盤 <b>"+dstr+"</b> · 營收 <b>"+roc(asOf.ym)+"</b><br>"+
    asOf.src+(cov.length?"（"+cov.join("＋")+"）":"")+
    (asOf.sheet?" ＋ 題材表":" · 題材表讀取失敗")+
    (miss.length?'<br><b class="warn">缺'+miss.join("、")+"，中位數只算在部分樣本上</b>":"");

  document.getElementById("note").innerHTML=
    "偏離＝本益比與股價淨值比對組內中位數的平均偏離，負值代表相對同組便宜。"+
    "綠底是折價且營益率不低於組內中位數；琥珀底是折價但獲利能力落後。"+
    "只有單一指標可用的公司（多半是虧損、沒有本益比）不給標記，並在偏離欄標示，"+
    "預設排序也排在後面——它們的偏離值跟雙指標算出來的不是同一個尺度。"+
    "營益率與毛利率來自題材表，是人工維護的資料，灰色代表財報季度落後組內最新。"+
    "組內少於 "+MIN_PEERS+" 檔時中位數不具意義。僅供研究，不構成投資建議。";

  var mb=document.getElementById("mode").children;
  for(i=0;i<mb.length;i++)(function(b){b.onclick=function(){mode=b.dataset.m;buildChips();};})(mb[i]);
  buildChips();
}

function diagPanel(){
  var h='<div class="status"><b>題材分組是空的。</b>三個分頁都讀到了，但沒有一筆對得起來。<br><br>';
  ["themes","links","comps"].forEach(function(k){
    var d=DIAG[k];
    if(!d){h+=k+"：沒有資料<br>";return;}
    h+="<b>"+k+"</b>："+d.data.length+" 列，欄名 <code>"+esc(d.cols.join(" / "))+"</code><br>";
  });
  h+="<br>對得起來的 company_theme 列數：<b>"+(DIAG.matched||0)+"</b><br><br>";
  if(DIAG.themes&&DIAG.themes.cols.indexOf("theme_id")<0)
    h+="themes 分頁沒有 <code>theme_id</code> 這一欄，第一列可能不是標題列。";
  else if(DIAG.links&&DIAG.links.cols.indexOf("ticker")<0)
    h+="company_theme 分頁沒有 <code>ticker</code> 這一欄，gid 可能對到別的分頁。";
  else
    h+="欄名都對，那就是 ticker 或 theme_id 的值對不上——ticker 要跟證交所代號一致（如 3037），theme_id 要跟 themes 分頁一致。";
  return h+"</div>";
}

function buildChips(){
  var mb=document.getElementById("mode").children;
  for(var i=0;i<mb.length;i++)mb[i].setAttribute("aria-pressed",String(mb[i].dataset.m===mode));
  var g=GROUPS[mode];
  var keys=Object.keys(g).sort(function(a,b){return g[b].length-g[a].length;});
  var nav=document.getElementById("chips");
  nav.innerHTML="";
  if(!keys.length){
    document.getElementById("tierrow").hidden=true;
    document.getElementById("panel").innerHTML=
      (mode==="theme"&&asOf.sheet)?diagPanel():
      '<div class="status">這個分頁沒有資料。</div>';
    return;
  }
  for(i=0;i<keys.length;i++){
    (function(k){
      var b=document.createElement("button");
      b.textContent=(mode==="theme"?THEMEMETA[k].name:k)+" "+g[k].length;
      b.dataset.k=k;
      b.onclick=function(){current=k;tier=null;buildTiers();};
      nav.appendChild(b);
    })(keys[i]);
  }
  current=keys[0];tier=null;buildTiers();
}

function buildTiers(){
  var cb=document.getElementById("chips").children;
  for(var i=0;i<cb.length;i++)cb[i].setAttribute("aria-pressed",String(cb[i].dataset.k===current));
  var row=document.getElementById("tierrow");
  if(mode!=="theme"){row.hidden=true;render();return;}
  var seen={},list=GROUPS.theme[current];
  for(i=0;i<list.length;i++)if(list[i].tier)seen[list[i].tier]=1;
  var tiers=Object.keys(seen).sort().reverse();
  if(!tiers.length){row.hidden=true;render();return;}
  if(tier===null)tier=tiers[0];
  row.hidden=false;
  row.innerHTML='<span class="lbl">曝險層級</span>';
  tiers.concat(["全部"]).forEach(function(tv){
    var b=document.createElement("button");
    b.textContent=tv;
    b.setAttribute("aria-pressed",String(tv===tier));
    b.onclick=function(){tier=tv;buildTiers();};
    row.appendChild(b);
  });
  render();
}

function render(){
  var list=GROUPS[mode][current];
  if(mode==="theme"&&tier&&tier!=="全部")
    list=list.filter(function(t){return t.tier===tier;});

  var mPE=median(list.map(function(t){return t.pe;}));
  var mPB=median(list.map(function(t){return t.pb;}));
  var mOPM=median(list.map(function(t){return t.opm;}));
  var mG=median(list.map(function(t){return t.yoy;}));
  var mDY=median(list.map(function(t){return t.dy;}));
  var qs=list.map(function(t){return t.quarter;}).filter(Boolean).sort();
  var newestQ=qs[qs.length-1];

  list.forEach(function(t){
    var d=[];
    if(t.pe!==null&&mPE)d.push(t.pe/mPE-1);
    if(t.pb!==null&&mPB)d.push(t.pb/mPB-1);
    t.devN=d.length;
    t.dev=d.length?d.reduce(function(a,b){return a+b;},0)/d.length:null;
    var cheap=t.dev!==null&&t.dev<=CHEAP_CUT;
    var ok=null;
    if(t.opm!==null&&mOPM!==null)ok=t.opm>=mOPM;
    else if(t.yoy!==null&&mG!==null)ok=t.yoy>=mG;
    t.flag=(!cheap||ok===null||t.devN<2)?"":(ok?"pick":"trap");
  });

  var rows=list.slice().sort(function(a,b){
    if(sortKey==="dev"&&a.devN!==b.devN)return b.devN-a.devN;
    var x=a[sortKey],y=b[sortKey];
    if(x===null||x===undefined)return 1;
    if(y===null||y===undefined)return -1;
    return typeof x==="string"?String(x).localeCompare(String(y))*sortDir:(x-y)*sortDir;
  });
  var maxAbs=0.35;
  list.forEach(function(t){if(t.dev!==null)maxAbs=Math.max(maxAbs,Math.abs(t.dev));});

  function th(k,l,c){
    return '<th data-k="'+k+'" class="'+(c||"")+'"'+
      (sortKey===k?' aria-sort="'+(sortDir===1?"ascending":"descending")+'"':"")+">"+l+"</th>";
  }
  var title=mode==="theme"?THEMEMETA[current].name:current;
  var parent=(mode==="theme"&&THEMEMETA[current].parent)
    ?'<div class="kv">上層 <span>'+THEMEMETA[current].parent+"</span></div>":"";

  var h='<div class="summary"><h2>'+title+"</h2>"+parent+
    '<div class="kv">'+list.length+" 檔"+(list.length<MIN_PEERS?"（過少）":"")+"</div>"+
    '<div class="kv">中位數 PE <span class="num">'+fix(mPE)+"</span></div>"+
    '<div class="kv">PB <span class="num">'+fix(mPB)+"</span></div>"+
    '<div class="kv">營益率 <span class="num">'+pct(mOPM)+"</span></div>"+
    '<div class="kv">殖利率 <span class="num">'+pct(mDY)+"</span></div></div>";

  h+="<table><thead><tr>"+th("code","代號")+th("name","名稱")+
    th("close","收盤","hide-sm")+th("pe","本益比")+th("pb","股價淨值比")+
    th("opm","營益率")+th("gpm","毛利率","hide-sm")+
    th("yoy","營收年增")+th("dev","偏離中位數")+"<th></th></tr></thead><tbody>";

  rows.forEach(function(t){
    var w=t.dev===null?0:Math.min(1,Math.abs(t.dev)/maxAbs)*50;
    var bar=t.dev===null?"":
      '<div class="devbar"><div class="axis"></div><div class="fill '+
      (t.dev<0?"cheap":"rich")+'" style="width:'+w.toFixed(1)+'%"></div></div>';
    var mark=t.flag==="pick"?'<span class="mark pick">折價候選</span>'
      :t.flag==="trap"?'<span class="mark trap">便宜有理由</span>':"";
    var badge=(mode==="theme"&&t.tier&&tier==="全部")
      ?'<span class="tierbadge">'+t.tier+"</span>":"";
    var only=t.devN===1?'<span class="onlybadge">'+(t.pe===null?"僅PB":"僅PE")+"</span>":"";
    var stale=(t.quarter&&newestQ&&t.quarter<newestQ)?"stale":"";
    var tip=(t.mainBiz||t.name)+(t.quarter?"｜財報季 "+t.quarter:"");
    h+='<tr class="'+t.flag+'" title="'+esc(tip)+'">'+
      '<td class="num code">'+t.code+"</td>"+
      '<td class="name">'+t.name+badge+"</td>"+
      '<td class="num hide-sm">'+fix(t.close,1)+"</td>"+
      '<td class="num">'+fix(t.pe)+"</td>"+
      '<td class="num">'+fix(t.pb)+"</td>"+
      '<td class="num '+stale+'">'+pct(t.opm)+"</td>"+
      '<td class="num hide-sm '+stale+'">'+pct(t.gpm)+"</td>"+
      '<td class="num '+(t.yoy===null?"":t.yoy>=0?"pos":"neg")+'">'+pct(t.yoy,0)+"</td>"+
      '<td class="num '+(t.dev===null?"":t.dev<0?"neg":"pos")+'">'+pct(t.dev,0)+only+bar+"</td>"+
      "<td>"+mark+"</td></tr>";
  });
  h+="</tbody></table>";
  document.getElementById("panel").innerHTML=h;

  var ths=document.querySelectorAll("thead th[data-k]");
  for(var i=0;i<ths.length;i++)(function(el){
    el.onclick=function(){
      var k=el.dataset.k;
      if(k===sortKey)sortDir*=-1;else{sortKey=k;sortDir=1;}
      render();
    };
  })(ths[i]);
}

load();
</script>
</body>
</html>
